# openspec/config.yaml — ResulTus
schema: spec-driven

context: |
  Tech stack: .NET 10.0 (C#), SDK 10.0.301
  Architecture: Not yet established — greenfield project
  Testing: No test projects created yet (test/ dir is empty)
  Style: MIT license, standard .NET .gitignore, no .editorconfig yet

rules:
  strict_tdd: false
  note: >
    Strict TDD is disabled because no test projects or runners exist yet.
    Enable it once a test project (e.g. xUnit, NUnit, MSTest) is added.

  proposal:
    - Include initial architecture decisions
    - Define scope clearly for a greenfield project
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns once established
    tdd: false
    test_command: ""
  verify:
    test_command: ""
    build_command: "dotnet build"
    coverage_threshold: 95
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: false
  detected: 2026-07-05
  runner:
    command: ""
    framework: "none — no test project created yet"
  layers:
    unit: { available: false, tool: "—" }
    integration: { available: false, tool: "—" }
    e2e: { available: false, tool: "—" }
  coverage:
    available: false
    tool: "coverlet"
    threshold: 95
    command: "—"
  quality:
    linter: { available: false, command: "—" }
    type_checker: { available: false, command: "—" }
    formatter: { available: false, command: "—" }
