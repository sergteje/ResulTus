name: CodeQL

# Static analysis for the C# surface, free on a public repository. The build is manual rather than
# autobuild: the solution multi-targets net8.0-net11.0 and its test projects are xUnit v3, which
# needs an app host per target framework, so autobuild's single SDK cannot compile it.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # The same four lines the build-and-test job needs: SDK 11 compiles every target
          # framework, the others provide the runtimes and app host packs the test projects use.
          dotnet-version: |
            11.0.x
            10.0.x
            9.0.x
            8.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: manual
      - name: Build
        run: dotnet build ResulTus.slnx -c Release
      - uses: github/codeql-action/analyze@v3
