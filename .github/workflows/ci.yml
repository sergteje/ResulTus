name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # SDK 11 compiles every TFM (net8.0..net11.0); SDK 10 provides the
          # runtime the net10.0 test projects execute on.
          dotnet-version: |
            11.0.x
            10.0.x
      - name: Build
        run: dotnet build ResulTus.slnx -c Release
      - name: Test
        run: dotnet test ResulTus.slnx -c Release --no-build

  # The coverage gates the owner fixed at 90% lines per package, measured per module from
  # the dedicated test runs (transitively referenced modules are excluded) — the script
  # prints one row per package and fails the job below threshold. Analyzers and the source
  # generator are excluded by design: Roslyn projects earn coverage in their own suites.
  coverage-gate:
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # Same pair as build-and-test: SDK 11 compiles all TFMs, SDK 10 runs
          # the net10.0 test projects the gate measures.
          dotnet-version: |
            11.0.x
            10.0.x
      - name: Build (Release)
        run: dotnet build ResulTus.slnx -c Release
      - name: Coverage gate (90% lines per package)
        run: pwsh -File scripts/coverage-gate.ps1 -Threshold 0.90

  # Publish-and-run proof for the claims annotated since 0.0.1: a console app
  # walking the AOT-safe System.Text.Json path is published trimmed and then
  # natively (windows-latest ships the MSVC linker this host lacks) and both
  # artifacts must execute with every assertion passing.
  aot-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # global.json requires 11.0.x (it publishes the net10.0 sample fine);
          # 10.0.x guarantees the .NET 10 runtime the trimmed publish executes on.
          dotnet-version: |
            11.0.x
            10.0.x
      - name: Publish (trimmed)
        run: dotnet publish samples/AotSmoke/ResulTus.AotSmoke.csproj -c Release /p:PublishTrimmed=true -o publish-trimmed
      - name: Run (trimmed)
        run: ./publish-trimmed/ResulTus.AotSmoke.exe
      - name: Publish (Native AOT)
        run: dotnet publish samples/AotSmoke/ResulTus.AotSmoke.csproj -c Release -r win-x64 /p:PublishAot=true -o publish-aot
      - name: Run (Native AOT)
        run: ./publish-aot/ResulTus.AotSmoke.exe

  # Proof for S4: the DocFX API-reference site builds without errors. Metadata
  # pins net10.0 so the multi-targeting libraries resolve to one deterministic
  # surface; the two Roslyn components (netstandard2.0) are excluded because
  # forcing net10.0 breaks their PrivateAssets compiler reference.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # global.json requires 11.0.x (it compiles every TFM); the docfx
          # metadata builds with the net10.0 pin under this SDK.
          dotnet-version: '11.0.x'
      - name: Restore local tools
        run: dotnet tool restore
      - name: Build DocFX site
        run: dotnet tool run docfx -- docs/docfx.json
