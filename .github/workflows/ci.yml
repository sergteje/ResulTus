name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  # Build, test and measure in one job on purpose: the coverage gate needs the Release build the
  # test step already produced, so a second job would check out, install four SDKs, restore and
  # rebuild the same solution only to run the same projects again with coverage collection.
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # SDK 11 compiles every TFM (net8.0..net11.0). The other three lines
          # install the runtimes the test projects execute on: every test
          # project multi-targets net8.0;net9.0;net10.0;net11.0, so a missing
          # runtime would turn a supported-TFM guarantee into an untested claim.
          dotnet-version: |
            11.0.x
            10.0.x
            9.0.x
            8.0.x
      # NuGet restore is the dominant fixed cost of a job that touches 29 projects. The key
      # follows the central package versions, so a dependency bump invalidates it and nothing
      # else does.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Build
        run: dotnet build ResulTus.slnx -c Release
      - name: Test
        run: dotnet test ResulTus.slnx -c Release --no-build
      # The coverage gates the owner fixed at 90% lines per package, measured per module from
      # the dedicated test runs (transitively referenced modules are excluded) - the script
      # prints one row per package and fails the job below threshold. Analyzers and the source
      # generator are excluded by design: Roslyn projects earn coverage in their own suites.
      # It reuses the Release build above: the script passes --framework net10.0 --no-build.
      - name: Coverage gate (90% lines per package)
        run: pwsh -File scripts/coverage-gate.ps1 -Threshold 0.90
      # The repository rule is that every code block in a document must compile. This step makes
      # it a check instead of a review habit: scripts/SnippetGate compiles all 126 ```csharp
      # blocks of the root readmes, docs/ and the package readmes against the shipped projects,
      # so a snippet that drifts from the API fails here. Its stubs supply only the ambient state
      # the fragments share between fences (see scripts/SnippetGate/Stubs).
      - name: Documentation snippet gate
        run: dotnet run --project scripts/SnippetGate -c Release

  # Publish-and-run proof for the claims annotated since 0.0.1: a console app
  # walking the AOT-safe System.Text.Json path is published trimmed and then
  # natively (windows-latest ships the MSVC linker this host lacks) and both
  # artifacts must execute with every assertion passing.
  aot-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # global.json requires 11.0.x (it publishes the net10.0 sample fine);
          # 10.0.x guarantees the .NET 10 runtime the trimmed publish executes on.
          dotnet-version: |
            11.0.x
            10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Publish (trimmed)
        run: dotnet publish samples/AotSmoke/ResulTus.AotSmoke.csproj -c Release /p:PublishTrimmed=true -o publish-trimmed
      - name: Run (trimmed)
        run: ./publish-trimmed/ResulTus.AotSmoke.exe
      - name: Publish (Native AOT)
        run: dotnet publish samples/AotSmoke/ResulTus.AotSmoke.csproj -c Release -r win-x64 /p:PublishAot=true -o publish-aot
      - name: Run (Native AOT)
        run: ./publish-aot/ResulTus.AotSmoke.exe

  # The same publish-and-run proof on Linux: the AOT guarantee must not depend on a
  # single platform. ubuntu runners ship the clang toolchain Native AOT needs.
  aot-smoke-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            11.0.x
            10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Publish (Native AOT)
        run: dotnet publish samples/AotSmoke/ResulTus.AotSmoke.csproj -c Release -r linux-x64 /p:PublishAot=true -o publish-aot
      - name: Run (Native AOT)
        run: ./publish-aot/ResulTus.AotSmoke

  # Proof for S4: the DocFX API-reference site builds without errors. Metadata
  # pins net10.0 so the multi-targeting libraries resolve to one deterministic
  # surface; the two Roslyn components (netstandard2.0) are excluded because
  # forcing net10.0 breaks their PrivateAssets compiler reference.
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # global.json requires 11.0.x (it compiles every TFM); the docfx
          # metadata builds with the net10.0 pin under this SDK.
          dotnet-version: '11.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json', '.config/dotnet-tools.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore local tools
        run: dotnet tool restore
      - name: Build DocFX site
        run: dotnet tool run docfx -- docs/docfx.json
