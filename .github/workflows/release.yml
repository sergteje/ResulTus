name: Release

# Publishes 0.x packages to NuGet every time a new v* tag is pushed and
# tags the release metadata in the changelog. Existing tags never
# re-trigger: a published version is immutable, so this workflow acts
# only on tags that were created after it existed.

on:
  push:
    tags: [ 'v*' ]

env:
  ARTIFACTS: packaging

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build (Release)
        run: dotnet build ResulTus.slnx -c Release
      - name: Test (Release)
        run: dotnet test ResulTus.slnx -c Release --no-build
      - name: Pack
        run: dotnet pack ResulTus.slnx -c Release -o ${{ env.ARTIFACTS }}

      - name: Push packages and symbols
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "${{ env.ARTIFACTS }}/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "${{ env.ARTIFACTS }}/*.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
