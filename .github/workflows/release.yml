name: Release

# Publishes 0.x packages to NuGet every time a new v* tag is pushed and
# tags the release metadata in the changelog. Existing tags never
# re-trigger: a published version is immutable, so this workflow acts
# only on tags that were created after it existed.

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  packages: write

env:
  ARTIFACTS: packaging

jobs:
  pack-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # global.json selects 11.0.x to compile every TFM (net8.0..net11.0);
          # 10.0.x provides the runtime the net10.0 test projects execute on.
          dotnet-version: |
            11.0.x
            10.0.x
      - name: Build (Release)
        run: dotnet build ResulTus.slnx -c Release
      - name: Test (Release)
        run: dotnet test ResulTus.slnx -c Release --no-build
      - name: Pack
        run: dotnet pack ResulTus.slnx -c Release -o ${{ env.ARTIFACTS }}

      # The tag is the covenant: the shared <Version> (the single source every
      # package takes its version from) must equal the pushed tag, and every
      # produced artifact must carry it in its filename — or nothing is
      # published. A drift would otherwise publish the wrong version under the
      # right release object.
      - name: Verify the tag matches every packaged version
        run: |
          expected="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          if [ -z "$declared" ] || [ "$declared" != "$expected" ]; then
            echo "::error::Directory.Build.props declares version '${declared:-none}' but the pushed tag is 'v$expected'"
            exit 1
          fi
          mismatch=0
          for pkg in "$ARTIFACTS"/*.nupkg "$ARTIFACTS"/*.snupkg; do
            name="$(basename "$pkg")"
            case "$name" in
              *."$expected".nupkg | *."$expected".snupkg) ;;
              *) echo "::error::$name does not carry the tag version '$expected'"; mismatch=1 ;;
            esac
          done
          [ "$mismatch" -eq 0 ] || exit 1

      - name: Push packages and symbols to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "${{ env.ARTIFACTS }}/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "${{ env.ARTIFACTS }}/*.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      # GitHub Packages mirror: makes every package appear on the repository's
      # Packages tab. Only .nupkg — GitHub Packages does not host .snupkg. The
      # run's own token carries packages:write; no secret to configure.
      - name: Push packages to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget add source \
            --name github \
            --username ${{ github.repository_owner }} \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push "${{ env.ARTIFACTS }}/*.nupkg" --source github --skip-duplicate

      # Tag and release are the same covenant: pushing a v* tag publishes the packages AND
      # creates the Release object with the notes taken verbatim from that version's changelog
      # section — no release object can exist without the tag it belongs to.
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(mktemp)
          awk -v section="## [$VERSION]" 'found { if ($0 ~ /^## /) exit; print } $0 == section { found = 1 }' CHANGELOG.md > "$NOTES"
          gh release create "$GITHUB_REF_NAME" \
            --title "ResulTus $VERSION" \
            --notes-file "$NOTES" \
            --latest
