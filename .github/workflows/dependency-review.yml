name: Dependency review

# Blocks a pull request that introduces a dependency with a high or critical advisory, using the
# repository's dependency graph. It runs only on pull requests: a push to main has nothing new to
# review that the pull request did not already cover.

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
